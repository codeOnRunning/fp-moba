<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B17"/>
      <stop offset="0.55" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#25324C"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B263A"/>
      <stop offset="1" stop-color="#33415A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E6A35"/>
      <stop offset="0.5" stop-color="#F4D791"/>
      <stop offset="1" stop-color="#9D7438"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#B9FBFF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#57E0F0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#57E0F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow">
      <stop offset="0" stop-color="#FFD0DD" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FF5C8A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF5C8A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#C9E6FF" opacity="0.7">
    <circle cx="180" cy="130" r="1.4"/><circle cx="260" cy="210" r="1"/><circle cx="390" cy="120" r="1.1"/>
    <circle cx="520" cy="180" r="1.4"/><circle cx="620" cy="80" r="1.2"/><circle cx="710" cy="150" r="1"/>
    <circle cx="840" cy="90" r="1.4"/><circle cx="980" cy="140" r="1.2"/><circle cx="1120" cy="70" r="1"/>
    <circle cx="1230" cy="190" r="1.4"/><circle cx="1360" cy="110" r="1.2"/><circle cx="1480" cy="210" r="1"/>
    <circle cx="330" cy="300" r="1"/><circle cx="1050" cy="280" r="1.1"/><circle cx="1440" cy="330" r="1"/>
  </g>

  <!-- distant star ring -->
  <g opacity="0.65">
    <ellipse cx="1110" cy="250" rx="255" ry="84" fill="none" stroke="#E8C77A" stroke-width="2.5"/>
    <ellipse cx="1110" cy="250" rx="205" ry="64" fill="none" stroke="#E8C77A" stroke-width="1" opacity="0.5"/>
    <ellipse cx="1110" cy="250" rx="310" ry="104" fill="none" stroke="#57E0F0" stroke-width="1" opacity="0.22"/>
    <circle cx="1110" cy="250" r="8" fill="#E8C77A"/>
    <circle cx="1110" cy="250" r="42" fill="none" stroke="#E8C77A" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- mountains -->
  <path d="M0 500 L190 390 L350 470 L540 360 L720 470 L900 390 L1080 480 L1260 380 L1440 470 L1600 410 L1600 900 L0 900 Z" fill="#121A2B"/>
  <path d="M0 560 L210 470 L390 540 L610 450 L790 550 L1010 470 L1210 550 L1410 470 L1600 540 L1600 900 L0 900 Z" fill="#182235" opacity="0.9"/>

  <!-- distant arch / landmark -->
  <g opacity="0.9">
    <rect x="700" y="390" width="34" height="230" fill="#2C374C"/>
    <rect x="866" y="390" width="34" height="230" fill="#2C374C"/>
    <path d="M700 420 Q800 300 900 420 L866 420 Q800 340 734 420 Z" fill="url(#gold)"/>
    <rect x="688" y="610" width="58" height="18" fill="#3C4A63"/>
    <rect x="854" y="610" width="58" height="18" fill="#3C4A63"/>
    <circle cx="800" cy="380" r="10" fill="#57E0F0"/>
    <circle cx="800" cy="380" r="40" fill="url(#cyanGlow)"/>
  </g>

  <!-- lane -->
  <path d="M520 900 L1080 900 L858 500 L742 500 Z" fill="url(#lane)"/>
  <path d="M520 900 L1080 900 L858 500 L742 500 Z" fill="none" stroke="#57E0F0" stroke-width="2" opacity="0.3"/>

  <!-- lane edge lines -->
  <path d="M520 900 L742 500" stroke="#57E0F0" stroke-width="3" opacity="0.75"/>
  <path d="M1080 900 L858 500" stroke="#FF5C8A" stroke-width="3" opacity="0.65"/>

  <!-- lane dash markers -->
  <g fill="#E8C77A" opacity="0.65">
    <rect x="792" y="840" width="16" height="5" rx="2"/>
    <rect x="796" y="760" width="12" height="4" rx="2"/>
    <rect x="800" y="690" width="9" height="3" rx="1.5"/>
    <rect x="803" y="640" width="7" height="2.5" rx="1.2"/>
    <rect x="805" y="600" width="5" height="2" rx="1"/>
  </g>

  <!-- side walls -->
  <path d="M0 900 L520 900 L742 500 L430 470 L0 640 Z" fill="#111827" opacity="0.95"/>
  <path d="M1600 900 L1080 900 L858 500 L1170 470 L1600 640 Z" fill="#111827" opacity="0.95"/>
  <path d="M0 640 L430 470 L742 500" stroke="#2A3448" stroke-width="12" fill="none"/>
  <path d="M1600 640 L1170 470 L858 500" stroke="#2A3448" stroke-width="12" fill="none"/>

  <!-- left cyan crystals -->
  <g>
    <circle cx="260" cy="650" r="90" fill="url(#cyanGlow)" opacity="0.7"/>
    <path d="M250 610 L284 660 L262 715 L228 662 Z" fill="#57E0F0" opacity="0.9"/>
    <path d="M250 610 L262 662 L228 662 Z" fill="#C8FBFF" opacity="0.8"/>
    <rect x="240" y="715" width="30" height="50" fill="#1E2A41"/>
  </g>

  <!-- right magenta obelisk -->
  <g>
    <circle cx="1320" cy="600" r="110" fill="url(#magentaGlow)" opacity="0.72"/>
    <path d="M1290 500 L1354 570 L1332 720 L1268 650 Z" fill="#3A1A2A" stroke="#FF5C8A" stroke-width="3"/>
    <path d="M1290 500 L1310 600 L1268 650 Z" fill="#FF5C8A" opacity="0.35"/>
    <circle cx="1310" cy="610" r="18" fill="#FF5C8A"/>
  </g>

  <!-- foreground staff silhouette -->
  <g opacity="0.9" transform="translate(1120 700) rotate(-18)">
    <rect x="0" y="0" width="18" height="330" rx="8" fill="#4B3A27"/>
    <rect x="-6" y="40" width="30" height="14" rx="6" fill="#B08A4B"/>
    <ellipse cx="9" cy="0" rx="56" ry="20" fill="url(#cyanGlow)" opacity="0.75"/>
    <path d="M9 -56 L50 0 L9 54 L-32 0 Z" fill="#B794FF" opacity="0.9"/>
    <path d="M9 -56 L20 0 L9 28 L-4 0 Z" fill="#F1E6FF" opacity="0.7"/>
  </g>

  <!-- foreground fog -->
  <rect x="0" y="600" width="1600" height="300" fill="#0B1020" opacity="0.12"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- title block -->
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <text x="68" y="82" fill="#E8C77A" font-size="15" letter-spacing="5">ART DIRECTION / v0.2</text>
    <text x="68" y="140" fill="#F4F7FF" font-size="42" font-weight="700" letter-spacing="3">暮色星穹 · 星辉峡谷</text>
    <text x="70" y="174" fill="#9FB0C9" font-size="15" letter-spacing="1.5">深靛夜空 / 月金遗迹 / 星青魔法 / 品红敌辉</text>
    <text x="70" y="200" fill="#71829B" font-size="12">第一人称 MOBA · 风格化低多边形 · 可读性优先</text>
  </g>

  <!-- palette -->
  <g transform="translate(68 760)" font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <g>
      <rect width="120" height="46" rx="8" fill="#0B1020" stroke="#38445C"/>
      <text x="12" y="20" fill="#E9F2FF" font-size="10">深靛夜空</text>
      <text x="12" y="36" fill="#7F90AA" font-size="9">#0B1020</text>
    </g>
    <g transform="translate(134 0)">
      <rect width="120" height="46" rx="8" fill="#2A3448" stroke="#4B5A74"/>
      <text x="12" y="20" fill="#E9F2FF" font-size="10">夜幕石灰</text>
      <text x="12" y="36" fill="#AEBBD0" font-size="9">#2A3448</text>
    </g>
    <g transform="translate(268 0)">
      <rect width="120" height="46" rx="8" fill="#E8C77A"/>
      <text x="12" y="20" fill="#1B1A1A" font-size="10">月金</text>
      <text x="12" y="36" fill="#5C4926" font-size="9">#E8C77A</text>
    </g>
    <g transform="translate(402 0)">
      <rect width="120" height="46" rx="8" fill="#57E0F0"/>
      <text x="12" y="20" fill="#0C1A22" font-size="10">星青</text>
      <text x="12" y="36" fill="#28606B" font-size="9">#57E0F0</text>
    </g>
    <g transform="translate(536 0)">
      <rect width="120" height="46" rx="8" fill="#FF5C8A"/>
      <text x="12" y="20" fill="#210A12" font-size="10">敌辉品红</text>
      <text x="12" y="36" fill="#6B2338" font-size="9">#FF5C8A</text>
    </g>
    <g transform="translate(670 0)">
      <rect width="120" height="46" rx="8" fill="#B794FF"/>
      <text x="12" y="20" fill="#151024" font-size="10">星紫</text>
      <text x="12" y="36" fill="#4B3A72" font-size="9">#B794FF</text>
    </g>
    <g transform="translate(804 0)">
      <rect width="120" height="46" rx="8" fill="#D9D2C3"/>
      <text x="12" y="20" fill="#1A1A1A" font-size="10">骨白</text>
      <text x="12" y="36" fill="#6E685D" font-size="9">#D9D2C3</text>
    </g>
  </g>

  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="end">
    <text x="1530" y="820" fill="#9FB0C9" font-size="11">目标地标：断裂星环 / 金色拱门 / 中央符文圈 / 敌方黑曜石尖塔</text>
    <text x="1530" y="844" fill="#71829B" font-size="10">左：蓝方星辉观测站 · 右：红方星蚀祭坛</text>
  </g>
</svg>
